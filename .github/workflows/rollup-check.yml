name: Rollup Check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 14 * *"
env:
  DEV_NOTICES_DISCORD_WEBHOOK_URL: ${{ secrets.DEV_NOTICES_DISCORD_WEBHOOK_URL }}
jobs:
  check-ready:
    name: Check Ready
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check
        run: |
          ./scripts/rollup/check-ready.sh || \
            curl -fsS -m 10 --retry 5 -o /dev/null \
              -X POST -H "Content-Type: application/json" \
              --data '{"content": "A dataset has a finished history year ready to roll up. Run ./scripts/rollup/advise.sh"}' \
              "$DEV_NOTICES_DISCORD_WEBHOOK_URL"
